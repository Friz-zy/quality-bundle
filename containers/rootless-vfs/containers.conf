[containers]
# Nested CI runners often do not delegate writable cgroups.
# Child containers inherit the runner's cgroup instead.
cgroups = "disabled"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"

[network]
# Pasta is Podman's default rootless network helper and does not require /dev/net/tun.
default_rootless_network_cmd = "pasta"
