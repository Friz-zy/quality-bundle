[storage]
driver = "vfs"
graphroot = "/home/podman/.local/share/containers/storage"
runroot = "/tmp/podman-run-1000/containers"

[storage.options.vfs]
# This enables the restricted single-UID fallback used by nested rootless Podman.
# Image ownership is squashed to the runner UID; images that require distinct Unix
# ownership semantics may not work correctly in this mode.
ignore_chown_errors = "true"
