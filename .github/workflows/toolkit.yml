name: Toolkit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Locked sync from the committed uv.lock: nested wrappers using --extra all
      # then reuse these versions instead of resolving or updating packages.
      - run: uv sync --locked --extra all
      # System packages land only on the disposable GitHub runner.
      - run: uv run --locked --extra all playwright install --with-deps chromium
      # Official immutable release artifact, checksum-pinned, extracted with
      # dpkg-deb -x (never dpkg -i, so no package maintainer scripts run).
      - name: Install Hurl 8.0.1 from the official release
        shell: bash
        run: |
          set -euo pipefail

          deb="$RUNNER_TEMP/hurl_8.0.1_amd64.deb"
          expected_sha256='e76e6c0957f83f9b761416452871554d0f068384b6cd004bff82dd8795c62225'

          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output "$deb" \
            https://github.com/Orange-OpenSource/hurl/releases/download/8.0.1/hurl_8.0.1_amd64.deb

          # Fail closed before extraction on any checksum mismatch.
          echo "$expected_sha256  $deb" > "$deb.sha256"
          sha256sum --check --strict "$deb.sha256"

          hurl_root="$RUNNER_TEMP/hurl"
          dpkg-deb -x "$deb" "$hurl_root"
          hurl_bin="$hurl_root/usr/bin"

          # hurl --version prints multi-line output; the first line starts with
          # "hurl 8.0.1" followed by host/libcurl build info.
          hurl_version="$("$hurl_bin/hurl" --version)"
          printf '%s\n' "$hurl_version"
          case "$hurl_version" in
            hurl\ 8.0.1*) ;;
            *)
              echo "::error::hurl --version does not report 8.0.1" >&2
              exit 1
              ;;
          esac

          for binary in "$hurl_bin"/*; do
            if ldd "$binary" 2>&1 | grep -- 'not found'; then
              echo "::error::$binary has unresolved shared libraries" >&2
              exit 1
            fi
          done

          # Expose hurl/hurlfmt to later steps only.
          echo "$hurl_bin" >> "$GITHUB_PATH"
      - name: Dependency preflight (fail fast before pytest)
        run: |
          uv run --locked --extra all python - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          import axe_playwright_python  # noqa: F401
          import locust  # noqa: F401
          import playwright  # noqa: F401
          import schemathesis  # noqa: F401
          import websockets  # noqa: F401
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              chromium = Path(p.chromium.executable_path)
          if not chromium.is_file():
              sys.exit(f"preflight failed: Playwright Chromium executable missing at {chromium}")

          try:
              hurl_version = subprocess.run(
                  ["hurl", "--version"], capture_output=True, text=True, check=True
              ).stdout.splitlines()[0]
          except (OSError, IndexError, subprocess.CalledProcessError) as exc:
              sys.exit(f"preflight failed: cannot run hurl --version: {exc}")
          if not re.match(r"hurl 8\.0\.1(?:\s|$)", hurl_version):
              sys.exit(f"preflight failed: unexpected hurl version: {hurl_version}")

          print(f"preflight ok: chromium={chromium}")
          print(f"preflight ok: hurl={hurl_version}")
          PY
      - run: uv run --locked --extra all pytest tests

  # Build once so both smoke jobs exercise the exact same image.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t quality-bundle:test .
      # WHY --privileged: nested rootless Podman must create user namespaces;
      # Docker's default seccomp profile denies clone/unshare(CLONE_NEWUSER)
      # without CAP_SYS_ADMIN, so this smoke run disables seccomp and grants
      # the capabilities (documented "podman in docker" pattern).
      - run: docker run --rm --privileged quality-bundle:test quality doctor
      - run: docker save --output /tmp/quality-bundle-image.tar quality-bundle:test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-bundle-image
          path: /tmp/quality-bundle-image.tar
          retention-days: 1

  # Docker-out-of-Docker: Testcontainers must work through the mounted host
  # Docker socket while the nested Podman service is disabled. PodmanRuntime
  # checks are intentionally absent here; the nested job covers them.
  smoke-dood:
    name: smoke (Testcontainers over host Docker socket)
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-bundle-image
          path: /tmp
      - run: docker load --input /tmp/quality-bundle-image.tar
      - name: Create and remove a container via Testcontainers on the host engine
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/smoke:/workspace/smoke:ro" \
            --env DOCKER_HOST=unix:///var/run/docker.sock \
            --env E2E_PODMAN_SERVICE=0 \
            --env TESTCONTAINERS_RYUK_DISABLED=true \
            --group-add "$(stat --format %g /var/run/docker.sock)" \
            quality-bundle:test \
            pytest smoke/test_dood_testcontainers.py

  # Nested rootless Podman: no Docker socket mounted; the entrypoint starts the
  # internal API socket (E2E_PODMAN_SERVICE=1 fails closed if it cannot start)
  # and the smoke really creates and removes containers through it.
  # --privileged is required for the same reason as in the image job: nested
  # rootless Podman must create user namespaces, and Docker's default
  # seccomp/AppArmor confinement denies that on GitHub-hosted runners.
  smoke-nested-podman:
    name: smoke (nested rootless Podman)
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-bundle-image
          path: /tmp
      - run: docker load --input /tmp/quality-bundle-image.tar
      - name: Create and remove containers via internal rootless Podman
        run: |
          docker run --rm \
            --privileged \
            --volume "$PWD/smoke:/workspace/smoke:ro" \
            --env E2E_PODMAN_SERVICE=1 \
            quality-bundle:test \
            pytest smoke/test_nested_podman.py
