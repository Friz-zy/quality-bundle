[project]
name = "quality-bundle"
version = "0.2.0"
description = "Reusable language-agnostic black-box quality and E2E harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pytest>=8",
  "pytest-xdist>=3",
  "testcontainers>=4",
]

[project.optional-dependencies]
api = ["schemathesis>=4"]
bdd = ["pytest-bdd>=8"]
ui = ["playwright>=1.50", "pytest-playwright>=0.7"]
accessibility = ["axe-playwright-python>=0.1.5", "playwright>=1.50", "pytest-playwright>=0.7"]
mobile = ["Appium-Python-Client>=5"]
grpc = ["grpcio>=1.70", "grpcio-reflection>=1.70"]
realtime = ["websockets>=15"]
reliability = ["testcontainers>=4"]
performance = ["locust>=2.40"]
all = [
  "schemathesis>=4",
  "pytest-bdd>=8",
  "playwright>=1.50",
  "pytest-playwright>=0.7",
  "axe-playwright-python>=0.1.5",
  "Appium-Python-Client>=5",
  "grpcio>=1.70",
  "grpcio-reflection>=1.70",
  "websockets>=15",
  "locust>=2.40",
]

[project.entry-points.pytest11]
quality_bundle = "quality_bundle.pytest_plugin"

[project.scripts]
quality = "quality_bundle.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_bundle"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers"]
markers = [
  "cli: CLI black-box tests",
  "api: explicit HTTP API tests",
  "contract: API contract tests",
  "workflow: cross-interface workflows",
  "bdd: BDD scenarios",
  "ui: browser UI tests",
  "accessibility: accessibility checks",
  "mobile: mobile application tests",
  "grpc: gRPC black-box tests",
  "realtime: WebSocket or SSE tests",
  "compatibility: compatibility matrix tests",
  "reliability: fault and recovery tests",
  "container: tests requiring a container runtime",
  "slow: slower E2E tests",
  "destructive: tests that mutate external resources",
]
